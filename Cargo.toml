[package]
name = "rgtop"
version = "4.2.0"
edition = "2024"
rust-version = "1.90" # let-chains, is_multiple_of, std::io::pipe
description = "btop-style live GPU/CPU dashboard for remote NVIDIA servers over SSH"
license = "MIT"
repository = "https://github.com/xianull/rgtop"
keywords = ["gpu", "nvidia", "monitoring", "tui", "ssh"]
categories = ["command-line-utilities"]

[dependencies]
libc = "0.2"
serde_json = "1"
signal-hook = "0.3"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort" # the panic hook restores the terminal first; a dead worker must not leave a half-alive UI
